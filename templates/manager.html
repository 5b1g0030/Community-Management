<!-- Flask 網頁前端 -->

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 標題 -->
    <title>社區人臉辨識系統 管理者端</title>
    <!-- 引入CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}"> <!-- 全域樣式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recognitionMessages.css') }}"> <!-- 即時顯示紀錄區樣式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}"> <!-- 浮窗樣式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dataTablesFilter.css') }}"> <!-- 浮窗樣式 -->
    <!-- 引入 DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">

</head>
<body>
    <!-- 顯示在網頁上的區域(start) -->
    <div class="container"> 
        <div class="main-content">
            <!-- 標題 -->
            <h1>社區人臉辨識系統</h1> 
            
            <!-- 功能按鈕區 -->
            <div class="function-buttons">
                <button type="button" id="addFaceBtn">加入人臉</button>
                <button type="button" id="testFaceBtn">測試辨識</button>
                <button type="button" id="viewFaceDbBtn">查看已登錄人臉</button>
                <button type="button" id="viewLogDbBtn">查看辨識紀錄</button>
                <button type="button" id="packageRegisterBtn">包裹登記</button>
                <button type="button" id="pickUpBtn">取貨</button>
            </div>

            <!-- 火災監測區域 -->
            <div class="fire-detection-section">
                <h2>火災監測</h2>
                <div class="fire-zones-container">
                    <div class="fire-zone-card" data-zone="A">
                        <div class="zone-header">
                            <span class="zone-label">A</span>
                        </div>
                        <div class="zone-info">
                            <div class="zone-temperature">26°</div>
                        </div>
                    </div>
                    <div class="fire-zone-card" data-zone="B">
                        <div class="zone-header">
                            <span class="zone-label">B</span>
                        </div>
                        <div class="zone-info">
                            <div class="zone-status">無異常</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 人工審核區 -->
            <div id="reviewPanel"></div>

            <!-- 資料表格(查看資料庫功能) -->
            <div id="dbTable" class="database-table" style="display: none;">
                <table>
                    <thead>
                        <!-- 表格欄位名稱 -->
                        <tr>
                            <th>ID</th>
                            <th>姓名</th>
                            <th>建立時間</th>
                        </tr>
                    </thead>

                    <!-- 用戶資料顯示區 -->
                    <tbody id="tableBody">
                        <!-- 
                        從前端 JavaScript 會取得資料庫資料，
                        動態建立 <tr>（表格列）並插入到這個 <tbody> 裡，讓網頁
                        即時顯示所有人臉資料 
                        -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 即時影像串流區域 -->
        <div class="video-section">
            <h2>即時影像串流</h2>
            <div class="video-container">
                <img id="video-stream" src="{{ url_for('video_feed') }}" alt="影像串流" >
            </div>
            
            <!-- 相機控制按鈕 -->
            <div class="camera-controls" style="margin-top: 15px; text-align: center;">
                <button id="toggleCamera" class="btn btn-primary">開啟相機</button>
                <span id="cameraStatus" style="margin-left: 15px; font-weight: bold; font-size: 16px;">相機狀態: 關閉</span>
            </div>
        </div>

        <!-- 辨識紀錄區域 -->
        <div class="recognition-log">
            <h2>辨識紀錄</h2>
            <div id="recognitionMessages"></div>
        </div>
    </div>
    <!-- 顯示在網頁上的區域(end) -->

    <!-- 引入 JavaScript -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    <!-- 引入 Flask SocketIO -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <!-- 引入 jQuery 和 DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

    <!-- 加入人臉 Modal(彈出視窗) -->
    <!--
        預設不顯示(display: none)
        固定位置(class="modal-content")
        關閉觸發(&times;)
        額外補充或覆蓋原樣式(style=...)這樣方便測試，確定後可以寫成不同的CSS
        position:fixed => 讓該元素不受其 他元素影響，不隨畫面滾動和移動
        z-index:2000 => 堆疊順序(數值越大越上層)，防止被其他元素覆蓋
        accept="image/*" => 允許的檔案類型(設定為接受所有圖片格式)
        required => 強制要求使用者必須填寫該欄位
    -->
    <div id="addFaceModal" class="modal" style="display:none;">
            <div class="modal-content"
                style="position:fixed; left:50vw; top:20vh; z-index:2000; min-width:300px; min-height:180px; resize:both; overflow:auto; box-shadow:0 2px 16px rgba(0,0,0,0.2);">
                <span class="close" id="closeAddFaceModal">&times;</span>
                <h2>加入人臉</h2>
                <form id="modalUploadForm" enctype="multipart/form-data">
                    <!-- 檔案上傳 -->
                    <input type="file" id="modalFaceImage" accept="image/*" required><br><br>
                    <!-- 輸入人名 -->
                    <input type="text" id="modalPersonName" placeholder="請輸入人名" required><br><br>
                    <button type="submit">送出</button>
                </form>
            </div>
    </div>
        
    <!-- 測試辨識 Modal(彈出視窗) -->
    <div id="testFaceModal" class="modal" style="display:none;">
            <div class="modal-content"
                style="position:fixed; left:55vw; top:25vh; z-index:2000; min-width:300px; min-height:180px; resize:both; overflow:auto; box-shadow:0 2px 16px rgba(0,0,0,0.2);">
                <span class="close" id="closeTestFaceModal">&times;</span>
                <h2>測試辨識</h2>
                <form id="modalTestForm" enctype="multipart/form-data">
                    <!-- 檔案上傳 -->
                    <input type="file" id="modalTestImage" accept="image/*" required><br><br>
                    <button type="submit">送出</button>
                </form>
                <div id="testResult"></div>
            </div>
    </div>
        
    <!-- 查看資料庫 Modal(彈出視窗) -->
    <div id="viewDbModal" class="modal" style="display:none;">
            <div class="modal-content"
                style="position:fixed; left:60vw; top:15vh; z-index:2000; min-width:350px; min-height:200px; max-height:80vh; resize:both; overflow:auto; box-shadow:0 2px 16px rgba(0,0,0,0.2);">
                <span class="close" id="closeViewDbModal">&times;</span>
                <h2>人臉資料庫</h2>
                <table style="width:100%;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>姓名</th>
                            <th>建立時間</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody"></tbody>
                </table>
            </div>
    </div>
    
    <!-- 查看辨識紀錄 Modal(彈出視窗) -->
    <div id="viewLogDbModal" class="modal" style="display:none;">
        <div class="modal-content"
            style="position:fixed; left:50vw; top:5vh; z-index:2000; min-width:900px; min-height:400px; max-height:90vh; resize:both; overflow:auto; box-shadow:0 2px 16px rgba(0,0,0,0.2);">
            <span class="close" id="closeViewLogDbModal">&times;</span>
            <h2>辨識紀錄資料庫</h2>

            <div class="filter-container">
                <h4>欄位篩選區</h4>
                <!--data-column => JavaScript 會讀取 data-column 屬性，知道要對表格的第幾欄進行篩選-->
                <!--下拉篩選框-->
                <select data-column="2">
                    <option value="">全部事件</option>
                    <option value="住戶">住戶</option>
                    <option value="未知">未知</option>
                    <option value="訪客">訪客</option>
                </select>
                
                <!-- 文字輸入篩選框-->
                <input type="text" data-column="3" placeholder="篩選 事件訊息">
                <input type="text" data-column="4" placeholder="篩選 人臉ID">
                <input type="text" data-column="5" placeholder="篩選 信心度">
                
                <!-- 日期篩選框 -->
                <br>
                <input type="number" id="filter-year" placeholder="年份 (如: 2024)" min="2020" max="2030" style="width: 120px;">
                <input type="number" id="filter-month" placeholder="月份 (1-12)" min="1" max="12" style="width: 100px;">
                <input type="number" id="filter-day" placeholder="日期 (1-31)" min="1" max="31" style="width: 100px;">
                <button id="clear-date-filter" style="margin-left: 10px; padding: 8px 12px;">清除日期篩選</button>
            </div>

            <div style="max-height:70vh; overflow-y:auto;">
                <table id="recognition_logs_table" class="display" style="width:100%;">
                    <thead>
                        <tr>
                            <th>ID</th>         <!-- data-column="0" -->
                            <th>發生時間</th>    <!-- data-column="1" -->
                            <th>事件類型</th>    <!-- data-column="2" -->
                            <th>事件訊息</th>    <!-- data-column="3" -->
                            <th>人臉ID</th>      <!-- data-column="4" -->
                            <th>信心度</th>      <!-- data-column="5" -->
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- 取貨 Modal(彈出視窗) -->
    <div id="pickUpModal" class="modal" style="display:none;">
        <div class="modal-content"
            style="position:fixed; left:50vw; top:10vh; z-index:2000; min-width:500px; min-height:400px; resize:both; overflow:auto; box-shadow:0 2px 16px rgba(0,0,0,0.2);">
            <span class="close" id="closePickUpModal">&times;</span>
            <h2>取貨辨識</h2>
            <div class="video-container">
                <img id="pickup-video-stream" src="" alt="取貨影像串流" style="width: 100%; max-width: 640px;">
            </div>
            <!-- 取貨狀態提示區 -->
            <div id="pickupStatusMessage" style="margin-top: 15px; padding: 10px; background: #4CAF50; color: white; font-size: 18px; font-weight: bold; text-align: center; display: none; border-radius: 5px;">
            </div>
            <p style="margin-top: 10px; color: #666;">辨識到人物後將自動關閉</p>
        </div>
    </div>
    
    <!-- 包裹登記 Modal(彈出視窗) -->
    <div id="packageRegisterModal" class="modal" style="display:none;">
        <div class="modal-content"
            style="position:fixed; left:50vw; top:20vh; z-index:2000; min-width:450px; min-height:300px; resize:both; overflow:auto; box-shadow:0 2px 16px rgba(0,0,0,0.2);">
            <span class="close" id="closePackageRegisterModal">&times;</span>
            <h2>包裹登記</h2>
            
            <!-- 櫃位狀態顯示 -->
            <div id="lockerStatusDisplay" style="margin-bottom: 20px;">
                <h3>櫃位狀態</h3>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <div id="locker1Status" class="locker-card">
                        <h4>1 號櫃</h4>
                        <p class="locker-status">載入中...</p>
                        <p class="locker-recipient"></p>
                        <button class="clear-locker-btn" style="display:none;" data-locker="1">清除</button>
                    </div>
                    <div id="locker2Status" class="locker-card">
                        <h4>2 號櫃</h4>
                        <p class="locker-status">載入中...</p>
                        <p class="locker-recipient"></p>
                        <button class="clear-locker-btn" style="display:none;" data-locker="2">清除</button>
                    </div>
                </div>
            </div>
            
            <!-- 登記表單 -->
            <form id="packageRegisterForm">
                <label for="recipientName">取件人（住戶名稱）：</label><br>
                <input type="text" id="recipientName" placeholder="請輸入取件人姓名" required style="width: 90%; padding: 8px; margin: 10px 0;"><br>
                <p style="font-size: 14px; color: #666;">系統將自動分配可用櫃位</p>
                <button type="submit" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer;">確認登記</button>
            </form>
        </div>
    </div>
    
</body>
</html>
