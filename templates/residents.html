<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>住戶頁面</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 5px; }
    .btn:hover { background: #0056b3; }
    .btn.mailbox { background: #28a745; }
    .btn.mailbox:hover { background: #218838; }
    .booking-result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; }
    .booking-code { font-size: 24px; font-weight: bold; color: #007bff; text-align: center; margin: 10px 0; }
    
    /* 彈出視窗樣式 */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
    .modal-content { background-color: #fefefe; margin: 5% auto; padding: 20px; border: none; border-radius: 10px; width: 80%; max-width: 700px; max-height: 80vh; overflow-y: auto; }
    .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    .close:hover { color: black; }
    .message-item { border: 1px solid #ddd; border-radius: 5px; padding: 15px; margin: 10px 0; background: #f9f9f9; }
    .message-item h4 { margin: 0 0 10px 0; color: #333; }
    .message-item p { margin: 5px 0; }
    .no-messages { text-align: center; color: #666; padding: 50px; }
    .visitor-image { max-width: 200px; max-height: 200px; border: 1px solid #ddd; border-radius: 5px; margin: 10px 0; }
    .review-buttons { margin: 15px 0; }
    .review-buttons button { padding: 8px 15px; margin: 0 5px; border: none; border-radius: 5px; cursor: pointer; }
    .approve-btn { background: #28a745; color: white; }
    .approve-btn:hover { background: #218838; }
    .reject-btn { background: #dc3545; color: white; }
    .reject-btn:hover { background: #c82333; }
    .status-pending { color: #ffc107; font-weight: bold; }
    .status-approved { color: #28a745; font-weight: bold; }
    .status-rejected { color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>住戶頁面</h1>
    
    <div>
      <label for="username">使用者名稱：</label>
      <input type="text" id="username" placeholder="請輸入您的使用者名稱" required>
    </div>
    
    <div>
      <button class="btn" id="generateBookingBtn">生成訪客預約碼</button>
      <button class="btn mailbox" id="mailboxBtn">信箱</button>
    </div>
    
    <div id="bookingResult" class="booking-result" style="display: none;">
      <h3>訪客預約碼已生成</h3>
      <div class="booking-code" id="bookingCode"></div>
      <p>請將此6位數字提供給您的訪客，訪客到達時管理員可使用此代碼確認身份。</p>
    </div>
  </div>

  <!-- 信箱彈出視窗 -->
  <div id="mailboxModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeMailboxModal">&times;</span>
      <h2>📮 訪客信箱</h2>
      <div id="mailboxContent">
        <p>載入中...</p>
      </div>
    </div>
  </div>

  <script>
    // ****************************************
    // 生成預約碼功能-按鈕點擊事件
    // ****************************************
    document.getElementById('generateBookingBtn').addEventListener('click', async () => {
      // 取得使用者名稱輸入框內的值(去除前後空白字元)
      const username = document.getElementById('username').value.trim();
      
      // 檢查是否有值
      if (!username) {
        alert('請輸入使用者名稱');
        return;
      }
      
      const formData = new FormData();  // 建立 FormData 來處理表單內容
      // 把使用者資料添加進表單(欄位-key, 數值-value)
      formData.append('username', username);
      
      try {
        // 向後端發送 POST 請求，把表單送出(目的: 生成訪客預約碼)
        const response = await fetch('/generate_booking_code', {
          method: 'POST',
          body: formData // 要發送的資料
        });
        
        // 將後端返回的資料轉換成JSON格式
        // response 包含: 狀態碼, 狀態訊息, 標頭, 內容資訊
        const result = await response.json();
        
        // 檢查回傳的狀態碼，判斷是否有成功執行(True, False)
        // response.ok => HTTP狀態碼介於200~299，在網頁可視為成功
        if (response.ok) {
          // 顯示到網頁指定標籤上
          document.getElementById('bookingCode').textContent = result.booking_code;
          document.getElementById('bookingResult').style.display = 'block';
        } 
        // 狀態碼不在範圍內時，顯示瀏覽器訊息
        else {
          alert(result.message);
        }
      } catch (error) {
        alert('生成預約碼失敗：' + error.message);
      }
    });

    // ***********
    // 信箱功能
    // ***********
    const mailboxModal = document.getElementById('mailboxModal');
    const mailboxBtn = document.getElementById('mailboxBtn');
    const closeMailboxModal = document.getElementById('closeMailboxModal');
    const mailboxContent = document.getElementById('mailboxContent');

    // 開啟信箱
    mailboxBtn.addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      
      if (!username) {
        alert('請先輸入使用者名稱');
        return;
      }
      
      mailboxModal.style.display = 'block';
      mailboxContent.innerHTML = '<p>載入中...</p>';
      
      try {
        // 使用查詢字串 (query string)把使用者名稱傳到後端，等待回應
        // 例如：GET /get_user_messages?username=Gina → username 會是 "Gina"
        const response = await fetch(`/get_user_messages?username=${encodeURIComponent(username)}`);

        // 把回傳的資料轉 JSON
        const result = await response.json();
        
        // 如果網頁狀態碼正常(200~299)
        if (response.ok) {
          displayMessages(result.messages);
        } else {
          mailboxContent.innerHTML = `<p style="color: red;">載入失敗：${result.message}</p>`;
        }
      } catch (error) {
        mailboxContent.innerHTML = `<p style="color: red;">載入失敗：${error.message}</p>`;
      }
    });

    // 關閉信箱
    closeMailboxModal.addEventListener('click', () => {
      mailboxModal.style.display = 'none';
    });

    // 點擊外部關閉
    window.addEventListener('click', (event) => {
      if (event.target === mailboxModal) {
        mailboxModal.style.display = 'none';
      }
    });

    // ===顯示信箱訊息內容===
    // 輸入 訪客留言訊息
    // 輸出 HTML
    function displayMessages(messages) {
      // 如果沒有訊息且訊息長度=0
      if (!messages || messages.length === 0) {
        mailboxContent.innerHTML = '<div class="no-messages">📭 目前沒有訪客留言</div>';
        return; // 結束函式
      }
      
      // 顯示訊息(HTML) 
      let html = '';
      messages.forEach((message, index) => {
        // 狀態顯示文字和顏色
        let statusText = '';
        let statusClass = '';
        let reviewButtons = '';
        
        switch(message.status) {
          case 'pending':
            statusText = '待審核';
            statusClass = 'status-pending';
            reviewButtons = `
              <div class="review-buttons">
                <p><strong>🤔 此圖片中是否為您邀請的訪客？</strong></p>
                <button class="approve-btn" onclick="reviewVisitor(${message.id}, 'approved')">✅ 是本人</button>
                <button class="reject-btn" onclick="reviewVisitor(${message.id}, 'rejected')">❌ 不是本人</button>
              </div>
            `;
            break;
          case 'approved':
            statusText = '已同意進入';
            statusClass = 'status-approved';
            break;
          case 'rejected':
            statusText = '已拒絕進入';
            statusClass = 'status-rejected';
            break;
        }
        
        html += `
          <div class="message-item">
            <h4>訪客留言 #${message.id}</h4>
            <p><strong>📅 時間：</strong>${message.created_date}</p>
            <p><strong>📋 狀態：</strong><span class="${statusClass}">${statusText}</span></p>
            ${message.booking_code ? `<p><strong>🎫 預約碼：</strong>${message.booking_code}</p>` : ''}
            ${message.reviewed_date ? `<p><strong>📝 審核時間：</strong>${message.reviewed_date}</p>` : ''}
            <div>
              <strong>📸 訪客照片：</strong><br>
              <img src="/${message.visitor_image_path}" alt="訪客照片" class="visitor-image">
            </div>
            ${reviewButtons}
          </div>
        `;
      });
      
      mailboxContent.innerHTML = html;
    }

    // ===== 訪客審核功能 =====
    // 輸入 留言ID、審核結果
    async function reviewVisitor(messageId, status) {
      const username = document.getElementById('username').value.trim();
      
      if (!username) {
        alert('請先輸入使用者名稱');
        return;
      }
      
      try {
        const formData = new FormData();
        formData.append('message_id', messageId);
        formData.append('status', status);
        formData.append('username', username);
        
        const response = await fetch('/review_visitor', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert(result.message);
          // 重新載入信箱內容
          mailboxBtn.click();
        } else {
          alert('審核失敗：' + result.message);
        }
      } catch (error) {
        alert('審核失敗：' + error.message);
      }
    }
  </script>
</body>
</html>
