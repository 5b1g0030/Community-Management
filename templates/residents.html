<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>住戶頁面</title>
  <!-- 引入外部 CSS -->
   <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}"> <!-- 全域樣式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}"> <!-- 浮窗樣式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/videoCamera.css') }}"> <!-- 影像串流樣式 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/residents.css') }}"> <!-- 預約&信箱樣式 -->
</head>
<body>
  <div class="residents-container">
    <h1>住戶頁面</h1>
    
    <div>
      <button class="residents-btn" id="visitor-booking-btn">申請訪客預約</button>
      <!--<button class="residents-btn mailbox" id="mailboxBtn">信箱</button>-->
      <button class="residents-btn" id="logoutBtn" onclick="window.location.href='/logout'" style="background-color: #f44336; color: white;">登出系統</button>
    </div>
  </div>

  <!-- 信箱彈出視窗 -->
  <div id="mailboxModal" class="modal">
    <div class="modal-content residents-modal-content">
      <span class="close" id="closeMailboxModal">&times;</span>
      <h2>📮 訪客信箱</h2>
      <div id="mailboxContent">
        <p>載入中...</p>
      </div>
    </div>
  </div>

  <!-- 訪客預約彈出視窗 -->
  <div id="visitor-booking-modal" class="modal">
    <div class="modal-content residents-modal-content">
        <span class="close">&times;</span>
        <h2>訪客預約</h2>
        <form id="visitor-booking-form">
            <label for="booking-username">住戶名稱:</label>
            <input type="text" id="booking-username" name="username" required>
            
            <h3>請上傳訪客照片</h3>
            <p style="color: #666; font-size: 0.9em;">請確保照片中能清楚看到人臉</p>
            
            <div style="margin-bottom: 15px;">
                <label for="front-face-input">正面照:</label>
                <input type="file" id="front-face-input" accept="image/*" required>
                <div id="front-face-preview" style="margin-top: 10px;"></div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="left-face-input">左微側臉:</label>
                <input type="file" id="left-face-input" accept="image/*" required>
                <div id="left-face-preview" style="margin-top: 10px;"></div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="right-face-input">右微側臉:</label>
                <input type="file" id="right-face-input" accept="image/*" required>
                <div id="right-face-preview" style="margin-top: 10px;"></div>
            </div>
            
            <button type="submit">提交預約</button>
        </form>
    </div>
  </div>

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    // ***********
    // 信箱功能
    // ***********
    const mailboxModal = document.getElementById('mailboxModal');
    const mailboxBtn = document.getElementById('mailboxBtn');
    const closeMailboxModal = document.getElementById('closeMailboxModal');
    const mailboxContent = document.getElementById('mailboxContent');

    // 開啟信箱
    mailboxBtn.addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      
      if (!username) {
        alert('請先輸入使用者名稱');
        return;
      }
      
      mailboxModal.style.display = 'block';
      mailboxContent.innerHTML = '<p>載入中...</p>';
      
      try {
        // 使用查詢字串 (query string)把使用者名稱傳到後端，等待回應
        // 例如：GET /get_user_messages?username=Gina → username 會是 "Gina"
        const response = await fetch(`/get_user_messages?username=${encodeURIComponent(username)}`);

        // 把回傳的資料轉 JSON
        const result = await response.json();
        
        // 如果網頁狀態碼正常(200~299)
        if (response.ok) {
          displayMessages(result.messages);
        } else {
          mailboxContent.innerHTML = `<p style="color: red;">載入失敗：${result.message}</p>`;
        }
      } catch (error) {
        mailboxContent.innerHTML = `<p style="color: red;">載入失敗：${error.message}</p>`;
      }
    });

    // 關閉信箱
    closeMailboxModal.addEventListener('click', () => {
      mailboxModal.style.display = 'none';
    });

    // 點擊外部關閉
    window.addEventListener('click', (event) => {
      if (event.target === mailboxModal) {
        mailboxModal.style.display = 'none';
      }
    });

    // ===顯示信箱訊息內容===
    // 輸入 訪客留言訊息
    // 輸出 HTML
    function displayMessages(messages) {
      // 如果沒有訊息且訊息長度=0
      if (!messages || messages.length === 0) {
        mailboxContent.innerHTML = '<div class="no-messages">📭 目前沒有訪客留言</div>';
        return; // 結束函式
      }
      
      // 顯示訊息(HTML) 
      let html = '';
      messages.forEach((message, index) => {
        // 狀態顯示文字和顏色
        let statusText = '';
        let statusClass = '';
        let reviewButtons = '';
        
        switch(message.status) {
          case 'pending':
            statusText = '待審核';
            statusClass = 'status-pending';
            reviewButtons = `
              <div class="review-buttons">
                <p><strong>🤔 此圖片中是否為您邀請的訪客？</strong></p>
                <button class="approve-btn" onclick="reviewVisitor(${message.id}, 'approved')">✅ 是本人</button>
                <button class="reject-btn" onclick="reviewVisitor(${message.id}, 'rejected')">❌ 不是本人</button>
              </div>
            `;
            break;
          case 'approved':
            statusText = '已同意進入';
            statusClass = 'status-approved';
            break;
          case 'rejected':
            statusText = '已拒絕進入';
            statusClass = 'status-rejected';
            break;
        }
        
        html += `
          <div class="message-item">
            <h4>訪客留言 #${message.id}</h4>
            <p><strong>📅 時間：</strong>${message.created_date}</p>
            <p><strong>📋 狀態：</strong><span class="${statusClass}">${statusText}</span></p>
            ${message.booking_code ? `<p><strong>🎫 預約碼：</strong>${message.booking_code}</p>` : ''}
            ${message.reviewed_date ? `<p><strong>📝 審核時間：</strong>${message.reviewed_date}</p>` : ''}
            <div>
              <strong>📸 訪客照片：</strong><br>
              <img src="/${message.visitor_image_path}" alt="訪客照片" class="visitor-image">
            </div>
            ${reviewButtons}
          </div>
        `;
      });
      
      mailboxContent.innerHTML = html;
    }

    // ===== 訪客審核功能 =====
    // 輸入 留言ID、審核結果
    async function reviewVisitor(messageId, status) {
      const username = document.getElementById('username').value.trim();
      
      if (!username) {
        alert('請先輸入使用者名稱');
        return;
      }
      
      try {
        const formData = new FormData();
        formData.append('message_id', messageId);
        formData.append('status', status);
        formData.append('username', username);
        
        const response = await fetch('/review_visitor', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert(result.message);
          // 重新載入信箱內容
          mailboxBtn.click();
        } else {
          alert('審核失敗：' + result.message);
        }
      } catch (error) {
        alert('審核失敗：' + error.message);
      }
    }
  </script>
</body>
</html>
